name: Build ROMs

on:
  push:
    branches: [main]
    paths-ignore:
      - "roms/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.14.1
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

      - name: Install lwasm
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          curl -fsSL -o lwtools.tar.gz https://www.lwtools.ca/releases/lwtools/lwtools-4.25.tar.gz
          tar -xzf lwtools.tar.gz
          make -C lwtools-4.25
          sudo make -C lwtools-4.25 install

      - name: Build cartridges
        run: zig build

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: vectrex-roms
          path: |
            zig-out/bin/*.bin
            zig-out/*.s
          if-no-files-found: error

      - name: Publish ROMs for the browser
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p roms
          cp zig-out/bin/hello.bin zig-out/bin/smile.bin roms/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roms/hello.bin roms/smile.bin
          if git diff --cached --quiet; then
            echo "ROMs unchanged"
            exit 0
          fi
          git commit -m "Publish the cartridges for jsvecx."
          git push
